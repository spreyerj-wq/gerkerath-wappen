<style>
/* Layout: one centred column, four coats of arms in a 2x2 grid, results under each. */
:root {
  --bg: #f5f3ee;
  --fg: #1c2321;
  --muted: #66706b;
  --card: #ffffff;
  --line: #dfdad0;
  --accent: #2c7a4b;
  --accent-soft: #e4f1e8;
  --bar: #2c7a4b;
  --track: #ebe7de;
  --warn: #a23b2a;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14191a;
    --fg: #eaeeec;
    --muted: #9aa49f;
    --card: #1d2324;
    --line: #2d3638;
    --accent: #6cc38e;
    --accent-soft: #203228;
    --bar: #6cc38e;
    --track: #2a3234;
    --warn: #ee8a79;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14191a;
  --fg: #eaeeec;
  --muted: #9aa49f;
  --card: #1d2324;
  --line: #2d3638;
  --accent: #6cc38e;
  --accent-soft: #203228;
  --bar: #6cc38e;
  --track: #2a3234;
  --warn: #ee8a79;
  color-scheme: dark;
}
body {
  background: var(--bg);
  color: var(--fg);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  line-height: 1.45;
}
.wrap {
  max-width: 680px;
  margin: 0 auto;
  padding-block: 28px 36px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header { animation: rise .5s both; }
.eyebrow {
  font-size: 12px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 700;
  margin: 0 0 6px;
}
h1 {
  font-size: 26px;
  line-height: 1.2;
  margin: 0 0 8px;
  text-wrap: balance;
}
.lead { color: var(--muted); margin: 0 0 20px; }
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.opt {
  appearance: none;
  font: inherit;
  color: inherit;
  text-align: center;
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: 16px;
  padding: 14px 12px 12px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease, background .18s ease;
  animation: rise .5s both;
  min-width: 0;
}
.opt:nth-child(2) { animation-delay: .08s; }
.opt:nth-child(3) { animation-delay: .16s; }
.opt:nth-child(4) { animation-delay: .24s; }
.opt:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--accent); }
.opt:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.opt.is-mine {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: 0 0 0 3px var(--accent-soft), 0 6px 18px rgba(0,0,0,.12);
}
.opt:disabled { cursor: default; }
.opt img {
  width: 100%;
  max-width: 180px;
  height: auto;
  display: block;
  transition: transform .25s ease;
}
.opt:hover:not(:disabled) img { transform: scale(1.04); }
.name { font-weight: 700; }
.result { width: 100%; }
.track {
  height: 8px;
  border-radius: 999px;
  background: var(--track);
  overflow: hidden;
}
.track i {
  display: block;
  height: 100%;
  width: 0;
  border-radius: 999px;
  background: var(--bar);
  transition: width .7s cubic-bezier(.2,.7,.2,1);
}
.count { font-size: 13px; color: var(--muted); margin-top: 6px; font-variant-numeric: tabular-nums; }
.badge {
  display: none;
  font-size: 12px;
  font-weight: 700;
  color: var(--accent);
}
.opt.is-mine .badge { display: inline; }
.foot {
  margin-top: 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px 14px;
  justify-content: space-between;
  align-items: baseline;
}
#status { font-size: 14px; color: var(--muted); margin: 0; }
#status.error { color: var(--warn); }
#total { font-size: 14px; font-weight: 700; margin: 0; font-variant-numeric: tabular-nums; }
@keyframes rise {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@media (max-width: 380px) {
  .grid { gap: 10px; }
  .opt { padding: 10px 8px 10px; }
  h1 { font-size: 23px; }
}
.opt:disabled{cursor:pointer}.opt{text-decoration:none}
</style>
